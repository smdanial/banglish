# Words that multiply the number before them: "dui hajar" = 2000, "pach sho" = 500.
# Joined forms also work: "pachsho" = 500, "duihajar" = 2000.
multipliers:
  sho: 100
  shoh: 100
  sow: 100
  shoto: 100
  hundred: 100
  hajar: 1000
  hazar: 1000
  hajaar: 1000
  hazaar: 1000
  thousand: 1000
  lakh: 100000
  lac: 100000
  lak: 100000

# Words that change the next number: "sharey 4" = 4.5 (4:30), "soa 4" = 4.25 (4:15),
# "paune 5" = 4.75 (4:45), "sharey tin hajar" = 3500.
modifiers:
  sharey: 0.5
  share: 0.5
  sare: 0.5
  saare: 0.5
  sarhe: 0.5
  shaare: 0.5
  soa: 0.25
  shoa: 0.25
  sowa: 0.25
  shoya: 0.25
  paune: -0.25
  poune: -0.25
  pone: -0.25

# Fraction words, only read as numbers before a multiplier or a time word:
# "der sho" = 150, "arai hajar" = 2500, "der tay" = 1:30.
fractions:
  der: 1.5
  dedh: 1.5
  arai: 2.5
  adai: 2.5
  aray: 2.5

# Short forms that only appear joined to a multiplier: "dusho" = 200.
compound_prefixes:
  du: 2

# Number words that are also everyday words ("at" in English, "noy" = "is not").
# They count as numbers only when followed by a multiplier, currency, unit or time word.
ambiguous:
  - at
  - noy
  - solo
  - one
